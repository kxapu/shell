[package]
name = "shell"
version = "0.1.0"
edition = "2024"

[dependencies]
#Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# WebSocket
tokio-tungstenite = "0.21"
tungstenite = "0.21"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Networking
bytes = "1"

#Concurrency
dashmap = "6"
parking_lot = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"]}
tracing-appender = "0.2"

# Utils
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
toml = "0.8"
chrono = "0.4"
async-trait = "0.1"
crossbeam-channel = "0.5"
num_cpus = "1"

[dev-dependencies]
criterion = "0.5"


# [[example]]
# name = "chat"
# path = "examples/chat.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
