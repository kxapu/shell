[server]
name = "shell-server"
log_level = "info"

[tcp]
enabled = true
addr = "0.0.0.0:9527"
max_connections = 10000
read_buffer_size = 8192
write_buffer_size = 8192

[websocket]
enabled = true
addr = "0.0.0.0:9528"
path = "/ws"
max_connections = 10000

[timer]
tick_interval_ms = 100
max_timers = 100_000
